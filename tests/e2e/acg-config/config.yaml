connectors:
- name: rc-e2e
  type: rocketchat
  server:
    url: http://rocketchat:3100
    username: acg_bot
    password: acg_bot_e2e_2024
  allowed_users:
    owners:
    - test_user
    guests: []
  attachments:
    max_file_size_mb: 10
    download_timeout: 30
  reply_in_thread: false
  permission_reply_in_thread: false
  context_inject_files: []
agent_templates:
  e2e-default:
    new_session_args: []
    context_inject_files: []
    working_directory: /root/.agent-chat-gateway/work
    guest_allowed_tools: []
    timeout: 180
    permissions:
      enabled: true
      timeout: 60
      skip_owner_approval: false
agents:
  e2e-opencode:
    inherits: e2e-default
    type: opencode
    command: opencode
    session_prefix: e2e-oc
    owner_allowed_tools:
    - tool: read
    - tool: glob
    - tool: grep
    - tool: write
    - tool: external_directory
    - tool: bash
  e2e-claude:
    inherits: e2e-default
    type: claude
    command: claude
    session_prefix: e2e-cc
    owner_allowed_tools:
    - tool: Read
    - tool: Glob
    - tool: Grep
    - tool: Write
    - tool: Bash
  e2e-claude-permission:
    inherits: e2e-default
    type: claude
    command: claude
    session_prefix: e2e-perm
  e2e-opencode-permission:
    inherits: e2e-default
    type: opencode
    command: opencode
    session_prefix: e2e-oc-perm
watcher_templates:
  e2e-default:
    connector: rc-e2e
    context_inject_files: []
watchers:
- name: e2e-dm
  inherits: e2e-default
  rooms:
    direct: true
  agent: e2e-opencode
- name: e2e-claude-channel
  inherits: e2e-default
  rooms:
    include:
    - acg-e2e-claude
  agent: e2e-claude
- name: e2e-permission
  inherits: e2e-default
  rooms:
    include:
    - acg-e2e-permission
  agent: e2e-claude-permission
- name: e2e-opencode-permission
  inherits: e2e-default
  rooms:
    include:
    - acg-e2e-opencode-permission
  agent: e2e-opencode-permission
